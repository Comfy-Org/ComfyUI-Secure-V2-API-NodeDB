[project]
name = "nixie-timer"
version = "1.1.0"
description = "Nixie-tube styled world clock and inference timer node for ComfyUI. Drag it into a workflow to show a glowing vintage vacuum-tube clock + inference timer that follows the canvas and auto-scales."
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/wul7chaos/Comfyui-nixie-timer"

[tool.comfy]
PublisherId = "vvling"
DisplayName = "ComfyUI Nixie Timer"
