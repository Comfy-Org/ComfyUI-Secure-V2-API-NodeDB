[project]
name = "comfyui-impact-pack"
description = "This node pack offers various detector nodes and detailer nodes that allow you to configure a workflow that automatically enhances facial details. And provide iterative upscaler."
version = "8.28.3"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE.txt" }
# Ultralytics and segment-anything run inside the isolated pack runtime, served by the pack's dependency
# profile (exact pins; everything else comes from the sealed guest base). SafeTensors parsing and
# model-asset resolution remain brokered by the host.
dependencies = [
    "ultralytics==8.4.198",
    "segment-anything==1.0",
    "opencv-python-headless==4.11.0.86",
    "torchvision==0.23.0",
    "tqdm==4.70.1",
    "nvidia-ml-py==13.615.71",
]

[project.urls]
Repository = "https://github.com/ltdrdata/ComfyUI-Impact-Pack"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "drltdata"
DisplayName = "ComfyUI Impact Pack"
Icon = ""
