# pyproject.toml
[project]
name = "ComfyUI-Image-Analysis-Tools"
description = "A suite of custom ComfyUI nodes built to evaluate and diagnose the technical qualities of images—especially those generated by AI models. Rather than creating visuals, these tools measure them, offering precise insights into sharpness, noise, exposure, color balance, and more."
version = "1.2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["opencv-python==5.0.0.93", "numpy==2.4.6", "torch==2.13.0", "matplotlib==3.11.1", "scikit-learn==1.9.0", "Pillow==12.3.0"]
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/ThatGlennD/ComfyUI-Image-Analysis-Tools"

[tool.comfy]
PublisherId = "verevolf"
DisplayName = "ComfyUI-Image-Analysis-Tools"
Icon = ""

[comfy_node]
display_name = "ComfyUI Image Analysis Toolkit"
description = "Custom ComfyUI nodes for evaluating image quality via sharpness, noise, contrast, entropy, and more."# trigger
