[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-advanced-photo-grain-secure-v2"
version = "2.0.0"
description = "Secure V2 film-grain and frequency-sharpening image nodes"
requires-python = ">=3.13,<3.14"
dependencies = ["torch", "torchvision"]
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/tritant/ComfyUI-Advanced-Photo-Grain"

[tool.comfy]
PublisherId = "tritant"
DisplayName = "Advanced Photo Grain (Secure V2)"
Icon = ""
