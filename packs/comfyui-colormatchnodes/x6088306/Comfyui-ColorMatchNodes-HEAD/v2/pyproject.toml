[project]
name = "comfyui-colormatchnodes"
description = "Two-reference color matching with manual or auto-ramped blend weights"
version = "1.1.0"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = ["torch>=2.13,<2.14", "numpy>=2.4,<2.5", "color-matcher>=0.6,<0.7"]

[project.urls]
Repository = "https://github.com/elyetis/Comfyui-ColorMatchNodes"

[tool.comfy]
PublisherId = "elyetis"
DisplayName = "Comfyui-ColorMatchNodes"

[tool.comfy.secure]
entrypoint = "__init__:NODE_CLASS_MAPPINGS"
