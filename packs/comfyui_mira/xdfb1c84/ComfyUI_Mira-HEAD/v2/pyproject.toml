# Secure Nodes V2 runtime declaration for ComfyUI_Mira (pin dfb1c847, version 0.6.0.1). The original has no
# pyproject.toml, only requirements.txt (numpy, opencv_python, Pillow, Requests, torch, torchvision, piexif, onnxruntime).
# The converted nodes need none beyond the guest base (torch, numpy, Pillow): their torchvision and color-transfer code
# is vendored, and the OpenCV methods are refused by name. The secure runtime declaration needs the Python version.
[project]
name = "ComfyUI_Mira"
version = "0.6.0.1"
requires-python = ">=3.13,<3.14"
