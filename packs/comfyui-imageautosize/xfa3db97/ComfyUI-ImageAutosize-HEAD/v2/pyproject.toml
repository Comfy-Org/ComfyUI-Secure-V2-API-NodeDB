[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-imageautosize"
description = "Secure automatic image and mask sizing nodes for ComfyUI"
version = "0.3.0"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy", "Pillow", "torch"]

[project.urls]
Repository = "https://github.com/SparknightLLC/ComfyUI-ImageAutosize"

[tool.comfy]
PublisherId = "sparknight"
DisplayName = "ComfyUI-ImageAutosize"
Icon = "https://example.com/icon.png"
