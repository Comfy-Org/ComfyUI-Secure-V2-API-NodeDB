[project]
name = "res4lyf-v2"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
# The ClownsharKSampler_Beta loop (res4lyf_core) and the beta57 scheduler run inside the isolated pack runtime,
# served by the pack's dependency profile (exact pins; everything else comes from the sealed guest base, including
# numpy, torch and mpmath, which torch's sympy requires). The other converted nodes and the refusals need only torch.
dependencies = [
    "einops==0.8.2",
    "scipy==1.18.1",
    "tqdm==4.70.1",
]
