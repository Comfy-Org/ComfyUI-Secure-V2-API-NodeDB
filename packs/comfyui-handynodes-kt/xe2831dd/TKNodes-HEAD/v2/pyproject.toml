[project]
name = "ComfyUI-HandyNodes-KT"
description = "Handy Nodes - GUI INPUTS, Video/Audio Chunking, Prompt looper, Speaker control, etc."
version = "1.2.9"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "numpy>=1.25.0",
    "Pillow",
    "opencv-python",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
]
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/trashkollector/TKNodes"

[tool.comfy]
PublisherId = "trashkollector"
DisplayName = "ComfyUI Handy Nodes"
Icon = ""
