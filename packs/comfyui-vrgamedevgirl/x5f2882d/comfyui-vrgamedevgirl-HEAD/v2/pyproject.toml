[project]
name = "comfyui-vrgamedevgirl"
description = "VRGameDevGirl custom nodes for the ComfyUI AI Video Builder, audio, image, video, workflow-runner, prompt-creator, and post-process workflows."
version = "9.1.1"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
# Secure Nodes V2: the converted nodes need only torch and numpy from the guest base (kornia is
# vendored in _vendor_kornia_color.py); the unconverted nodes refuse and import nothing.
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/vrgamegirl19/comfyui-vrgamedevgirl"
"Bug Tracker" = "https://github.com/vrgamegirl19/comfyui-vrgamedevgirl/issues"
Documentation = "https://github.com/vrgamegirl19/comfyui-vrgamedevgirl/blob/main/Workflows/LTX-2_Workflows/Video_Builder/readme.md"

[tool.comfy]
PublisherId = "vrgamedevgirl"
DisplayName = "VRGameDevGirl Custom Nodes"
