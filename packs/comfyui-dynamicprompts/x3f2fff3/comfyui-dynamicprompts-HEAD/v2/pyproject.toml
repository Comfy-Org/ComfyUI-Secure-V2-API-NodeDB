[project]
name = "ComfyUI - Dynamic Prompts"
version = "0.2.1"
requires-python = ">=3.13,<3.14"
# Secure Nodes V2: exact pins, served to the guest by a pack dependency profile. The original
# required dynamicprompts[attentiongrabber,magicprompt]~=0.30.2 and its requirements.txt pins
# dynamicprompts==0.30.2. The two extras are dropped: no node in this pack uses the attention
# grabber, and DPMagicPrompt is refused. PyYAML is pinned because the library reads .yaml wildcard
# files with it, and a ComfyUI host always has it.
dependencies = [
    "dynamicprompts==0.30.2",
    "pyparsing==3.3.3",
    "pyyaml==6.0.3",
]

[tool.ruff]
target-version = "py310"
select = [
    "B",
    "C",
    "COM",
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "C901", # Complexity
    "E501", # Line length
    "B019", # functools.lrucache
]
unfixable = [
    "B007", # Loop control variable not used within the loop body
]
