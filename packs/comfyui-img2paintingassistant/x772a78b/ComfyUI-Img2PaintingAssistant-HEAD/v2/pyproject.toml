[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-img2paintingassistant-secure-v2"
version = "2.0.0"
description = "Secure Nodes V2 image-painting and background assistants"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy", "opencv-python", "torch"]

[project.urls]
Repository = "https://github.com/Isi-dev/ComfyUI-Img2PaintingAssistant"

[tool.comfy]
PublisherId = "isi-dev"
DisplayName = "ComfyUI-Img2PaintingAssistant (Secure V2)"
Icon = ""
