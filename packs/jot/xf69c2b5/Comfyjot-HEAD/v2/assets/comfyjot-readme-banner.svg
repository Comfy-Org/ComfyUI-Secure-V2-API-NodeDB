<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Comfy Jot</title>
  <desc id="desc">Comfy Jot README banner with a dark ComfyUI-inspired canvas, orange note accents, and a floating tool dock.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="48" x2="1480" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E13"/>
      <stop offset="0.5" stop-color="#12161D"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1170 140) rotate(117.019) scale(292.253 412.13)">
      <stop stop-color="#FFB347" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="910" y1="74" x2="1468" y2="398" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E7890" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6E7890" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="1600" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="34" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="32" fill="url(#bg)"/>
  <rect x="34" y="34" width="1532" height="452" rx="24" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="1184" cy="138" r="210" fill="url(#accentGlow)"/>

