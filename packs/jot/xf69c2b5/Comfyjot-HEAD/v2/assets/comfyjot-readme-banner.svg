  <path d="M1266 110H1492" stroke="#2A313D" stroke-width="8" stroke-linecap="round"/>
  <path d="M1214 144H1492" stroke="#7BDFF2" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>

  <text x="110" y="246" fill="#F6F8FC" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="8">COMFY</text>
  <text x="110" y="348" fill="#FFB347" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="8">JOT</text>

  <text x="114" y="414" fill="#A9B1BF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="1.2">
    Draw notes directly on the ComfyUI graph and keep them with the workflow
  </text>

