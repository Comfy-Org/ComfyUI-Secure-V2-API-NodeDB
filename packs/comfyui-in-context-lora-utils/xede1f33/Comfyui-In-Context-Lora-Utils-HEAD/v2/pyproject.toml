[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-in-context-lora-utils-secure-v2"
version = "2.0.0"
description = "Secure V2 in-context image and mask composition utilities"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy", "opencv-python-headless", "torch"]
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/lrzjason/Comfyui-In-Context-Lora-Utils"

[tool.comfy]
PublisherId = "lrzjason"
DisplayName = "Comfyui-In-Context-Lora-Utils (Secure V2)"
Icon = ""
