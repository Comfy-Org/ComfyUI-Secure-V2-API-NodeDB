[tool.poetry]
name = "comfymath"
version = "0.1.0"
description = "Math nodes for ComfyUI"
authors = ["Evan Spearman <evan@spearman.mb.ca>"]
license = { text = "Apache License 2.0" }
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "2.4.6"

[tool.poetry.group.dev.dependencies]
mypy = "^1.4.1"
black = "^23.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Explicit selected local development dependency; upstream Poetry's ^1.25.1
# remains in pristine as provenance, not a claim NumPy 2.4.6 satisfies it.
[project]
name = "comfymath-secure-v2"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.4.6"]
