[project]
name = "ComfyUI-Simple_QR_Codes"
description = "ComfyUI node for writing and reading QR codes."
version = "0.0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["segno==1.6.1", "segno-pil==1.0.0", "qrcode==8.0", "Pillow==12.3.0", "opencv-python==5.0.0.93", "numpy==2.4.6", "torch==2.13.0", "torchvision==0.28.0"]
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/zentrocdot/ComfyUI_Simple_QR_Codes"
