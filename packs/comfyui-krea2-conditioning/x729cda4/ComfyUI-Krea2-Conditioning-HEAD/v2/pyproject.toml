[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-krea2-conditioning"
version = "1.0.0"
description = "Secure Krea 2 conditioning rebalance node for ComfyUI"
requires-python = ">=3.13,<3.14"
dependencies = ["torch"]

[project.urls]
Repository = "https://github.com/huwhitememes/comfyui-krea2-conditioning"

[tool.comfy]
PublisherId = "huwhitememes"
DisplayName = "ComfyUI Krea2 Conditioning"
